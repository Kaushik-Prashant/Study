<div class="shell">
  <aside class="sidebar" [class.open]="sidebarOpen()">
    <div class="sidebar-brand">
      <span class="brand-mark">{{ data.totalDays }}</span>
      <div class="brand-text">
        <strong>Learning Command Center</strong>
        <small>{{ data.totalDays }}-day plan</small>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a
        *ngFor="let item of navItems"
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.path === '/' }"
        (click)="closeSidebar()"
        class="nav-link"
      >
        <span class="nav-icon">{{ item.icon }}</span>
        {{ item.label }}
      </a>
    </nav>
  </aside>

  <div class="backdrop" *ngIf="sidebarOpen()" (click)="closeSidebar()"></div>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" (click)="toggleSidebar()" aria-label="Toggle menu">☰</button>
      <button class="search-trigger" (click)="openSearch()">
        <span>🔍</span>
        <span class="search-trigger-label">Search topics, weeks...</span>
        <kbd>Ctrl K</kbd>
      </button>
      <a routerLink="/roadmap" class="today-btn">Day {{ progress.currentDay() }} / {{ data.totalDays }}</a>
    </header>

    <main class="page">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<div class="search-backdrop" *ngIf="searchOpen()" (click)="closeSearch()">
  <div class="search-panel" (click)="$event.stopPropagation()">
    <input
      class="search-input"
      type="text"
      placeholder="Search topics, weeks, certifications..."
      [ngModel]="query()"
      (ngModelChange)="query.set($event)"
      autofocus
    />
    <div class="search-results" *ngIf="results().length; else noResults">
      <button class="search-result" *ngFor="let r of results()" (click)="goTo(r.link)">
        <span class="result-label">{{ r.label }}</span>
        <span class="result-sublabel">{{ r.sublabel }}</span>
      </button>
    </div>
    <ng-template #noResults>
      <p class="search-empty" *ngIf="query().trim().length >= 2">No matches.</p>
      <p class="search-empty" *ngIf="query().trim().length < 2">Type at least 2 characters...</p>
    </ng-template>
  </div>
</div>
